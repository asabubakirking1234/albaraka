      <stop offset="0" stop-color="#ece5d6"/>
      <stop offset="1" stop-color="#dcd2c0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#1d2922" stroke-opacity=".05"/>
