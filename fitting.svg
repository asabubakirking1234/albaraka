<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="PP fitinglar to'plami">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe8db"/>
      <stop offset="1" stop-color="#ddd4c2"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#1d2922" stroke-opacity=".05"/>
    </pattern>
    <linearGradient id="pp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe5d3"/>
      <stop offset=".45" stop-color="#aebfa5"/>
      <stop offset="1" stop-color="#7d8f74"/>
    </linearGradient>
    <linearGradient id="ppdark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7c7ad"/>
      <stop offset="1" stop-color="#65775d"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="15" stdDeviation="11" flood-color="#2a2114" flood-opacity=".24"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <circle cx="612" cy="164" r="168" fill="#e7622a" opacity=".08"/>
  <path d="M44 50h84M44 50v84M756 550h-84M756 550v-84" fill="none" stroke="#1d2922" stroke-opacity=".22"/>
  <text x="46" y="43" fill="#1d2922" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.8">AL BARAKA</text>
  <text x="754" y="43" fill="#6f776e" font-family="Arial,Helvetica,sans-serif" font-size="8" letter-spacing="2" text-anchor="end">PLUMBING / FITTINGS</text>
  <ellipse cx="400" cy="500" rx="280" ry="32" fill="#7d6d54" opacity=".2" filter="url(#blur)"/>

  <!-- coupling -->
  <g transform="translate(130 310) rotate(-8)" filter="url(#shadow)">
    <rect x="0" y="0" width="146" height="66" rx="18" fill="url(#pp)"/>
    <rect x="12" y="9" width="122" height="14" rx="7" fill="#e7efe1" opacity=".6"/>
    <rect x="0" y="0" width="16" height="66" rx="8" fill="#e7622a"/>
    <rect x="130" y="0" width="16" height="66" rx="8" fill="#e7622a"/>
    <ellipse cx="73" cy="33" rx="20" ry="17" fill="#68805f"/>
    <ellipse cx="73" cy="33" rx="13" ry="11" fill="#41543a"/>
  </g>

  <!-- elbow -->
  <g transform="translate(338 250) rotate(4)" filter="url(#shadow)">
    <path d="M22 0h56v98q0 28 28 28h56v56h-56q-84 0-84-84Z" fill="url(#pp)"/>
    <path d="M22 0h56v98q0 28 28 28h8v56h-8q-84 0-84-84Z" fill="#c9d7c0" opacity=".5"/>
    <ellipse cx="106" cy="28" rx="28" ry="12" fill="#6b7f62"/>
    <ellipse cx="106" cy="28" rx="19" ry="7" fill="#455a3d"/>
    <ellipse cx="134" cy="154" rx="28" ry="12" fill="#6b7f62" transform="rotate(90 134 154)"/>
    <ellipse cx="134" cy="154" rx="19" ry="7" fill="#455a3d" transform="rotate(90 134 154)"/>
    <path d="M34 12h30" stroke="#f8f3e8" stroke-opacity=".5" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- tee -->
  <g transform="translate(546 352) rotate(-4)" filter="url(#shadow)">
    <rect x="0" y="0" width="186" height="58" rx="18" fill="url(#ppdark)"/>
    <rect x="72" y="52" width="56" height="88" rx="18" fill="url(#pp)"/>
    <rect x="16" y="10" width="70" height="12" rx="6" fill="#dce7d4" opacity=".5"/>
    <ellipse cx="100" cy="140" rx="28" ry="12" fill="#5d7155"/>
    <ellipse cx="100" cy="140" rx="19" ry="7" fill="#394d32"/>
    <ellipse cx="7" cy="29" rx="14" ry="28" fill="#71856a" transform="rotate(0)"/>
    <ellipse cx="178" cy="29" rx="14" ry="28" fill="#71856a"/>
    <rect x="0" y="0" width="12" height="58" rx="6" fill="#e7622a"/>
  </g>

  <!-- small valve -->
  <g transform="translate(212 416) rotate(6)" filter="url(#shadow)">
    <rect x="0" y="0" width="138" height="54" rx="16" fill="url(#pp)"/>
    <rect x="52" y="-30" width="34" height="54" rx="8" fill="#71856a"/>
    <rect x="38" y="-46" width="62" height="20" rx="6" fill="#e7622a"/>
    <path d="M18 10h30M90 10h30" stroke="#f8f3e8" stroke-opacity=".45" stroke-width="4" stroke-linecap="round"/>
    <circle cx="69" cy="-36" r="5" fill="#1d2922"/>
  </g>

  <!-- elbow small -->
  <g transform="translate(566 98) rotate(-15)" filter="url(#shadow)">
    <path d="M14 0h40v52q0 18 18 18h40v40h-42q-56 0-56-56Z" fill="url(#pp)"/>
    <ellipse cx="54" cy="19" rx="20" ry="8" fill="#6b7f62"/>
    <ellipse cx="54" cy="19" rx="13" ry="5" fill="#455a3d"/>
    <ellipse cx="93" cy="91" rx="20" ry="8" fill="#6b7f62" transform="rotate(90 93 91)"/>
  </g>

  <g transform="translate(74 96)">
    <rect x="0" y="0" width="148" height="88" rx="3" fill="#fffdf8" opacity=".9"/>
    <text x="13" y="20" fill="#6f776e" font-family="Arial,Helvetica,sans-serif" font-size="7" font-weight="700" letter-spacing="1.2">SET FOR 25 MM PIPE</text>
    <text x="13" y="48" fill="#1d2922" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800">20 PCS</text>
    <path d="M13 58h120" stroke="#d9d1c2"/>
    <text x="13" y="73" fill="#4d584f" font-family="Arial,Helvetica,sans-serif" font-size="7" letter-spacing="1">ELBOWS · TEES · COUPLINGS</text>
  </g>

  <g transform="translate(46 540)">
    <rect x="0" y="0" width="196" height="26" rx="2" fill="#fffdf8" opacity=".8"/>
    <text x="12" y="17" fill="#1d2922" font-family="Arial,Helvetica,sans-serif" font-size="8" font-weight="700" letter-spacing="1.5">PP FITTINGS · SET OF 20 · 25 MM</text>
  </g>
  <text x="754" y="558" fill="#6f776e" font-family="Arial,Helvetica,sans-serif" font-size="8" letter-spacing="1.8" text-anchor="end">PLUMBING / 03</text>
</svg>
