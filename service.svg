          <path d="M47 47l31 11-22 22z"/><path d="M273 47l-31 11 22 22z"/>
          <path d="M47 273l31-11-22-22z"/><path d="M273 273l-31-11 22-22z"/>
          <path d="M111 14l4 26-20-8z"/><path d="M209 14l-4 26 20-8z"/>
          <path d="M111 306l4-26-20 8z"/><path d="M209 306l-4-26 20 8z"/>
          <path d="M14 111l26 4-8-20z"/><path d="M14 209l26-4-8 20z"/>
          <path d="M306 111l-26 4 8-20z"/><path d="M306 209l-26-4 8 20z"/>
          <path d="M63 87l22 16-26 7z"/><path d="M257 87l-22 16 26 7z"/>
          <path d="M63 233l22-16-26-7z"/><path d="M257 233l-22-16 26-7z"/>
