<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Rover kesish xizmati">
  <defs>
    <radialGradient id="disc" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#314237"/>
      <stop offset="1" stop-color="#18231d"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset=".35" stop-color="#d8d7ce"/>
      <stop offset=".6" stop-color="#f8f3e8"/>
      <stop offset="1" stop-color="#a8aea5"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
