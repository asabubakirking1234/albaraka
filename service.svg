      <stop offset="1" stop-color="#d9cdb8"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#0b110d" flood-opacity=".36"/>
    </filter>
    <clipPath id="discClip">
      <circle cx="400" cy="300" r="254"/>
    </clipPath>
  </defs>

  <circle cx="400" cy="300" r="254" fill="url(#disc)" filter="url(#shadow)"/>
