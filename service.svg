    <circle cx="400" cy="300" r="254" fill="none" stroke="#f8f3e8" stroke-opacity=".12" stroke-width="1.4"/>
    <g fill="none" stroke="#f8f3e8" stroke-opacity=".07">
      <path d="M146 160h508M146 220h508M146 280h508M146 340h508M146 400h508M146 460h508"/>
      <path d="M180 46v508M260 46v508M340 46v508M420 46v508M500 46v508M580 46v508"/>
    </g>
    <circle cx="400" cy="300" r="218" fill="none" stroke="#e7622a" stroke-opacity=".35" stroke-width="1.2" stroke-dasharray="4 10"/>

    <!-- sparks -->
    <g fill="#ffcf7a">
      <path d="m520 236 44-26-18 38 40 4-38 22 18 30-38-10-10 32-18-32-30 20 14-34-34-6 36-16-18-28z" opacity=".9"/>
      <circle cx="586" cy="208" r="4"/><circle cx="620" cy="252" r="3"/><circle cx="548" cy="176" r="2.5"/>
      <circle cx="646" cy="190" r="2"/><circle cx="604" cy="304" r="2.4"/>
    </g>
    <g stroke="#ffcf7a" stroke-linecap="round" opacity=".7">
      <path d="M544 246 646 200" stroke-width="2"/>
