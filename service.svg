        <circle cx="160" cy="160" r="126" fill="none" stroke="#8f988f" stroke-width="1.4" opacity=".6"/>
        <circle cx="160" cy="160" r="92" fill="none" stroke="#8f988f" stroke-width="1" opacity=".45" stroke-dasharray="4 7"/>
        <circle cx="160" cy="160" r="52" fill="#e7622a"/>
        <circle cx="160" cy="160" r="40" fill="#1d2922"/>
        <circle cx="160" cy="160" r="14" fill="#f8f3e8"/>
        <path d="M142 160h36M160 142v36" stroke="#1d2922" stroke-width="4" stroke-linecap="round"/>
      </g>
    </g>

    <!-- ruler -->
    <g transform="translate(120 470) rotate(-3)">
      <rect x="0" y="0" width="420" height="58" rx="4" fill="#f0c04b"/>
      <rect x="0" y="0" width="420" height="16" fill="#e7622a"/>
      <g stroke="#1d2922" stroke-width="1.2">
        <path d="M20 22v18M44 22v12M68 22v18M92 22v12M116 22v18M140 22v12M164 22v18M188 22v12M212 22v18M236 22v12M260 22v18M284 22v12M308 22v18M332 22v12M356 22v18M380 22v12M404 22v18"/>
