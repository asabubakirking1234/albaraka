<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" role="img" aria-label="Al Baraka qurilish mollari do'koni">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4efe5"/>
      <stop offset="1" stop-color="#e3d9c8"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0v34" fill="none" stroke="#1d2922" stroke-opacity=".055"/>
    </pattern>
    <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3f33"/>
      <stop offset="1" stop-color="#17221b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfd9cd" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#f8f3e8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#8fa091" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="awning" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f07a40"/>
      <stop offset="1" stop-color="#d6541c"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="190%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#2a2114" flood-opacity=".24"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="900" height="760" fill="url(#sky)"/>
  <rect width="900" height="760" fill="url(#grid)"/>
