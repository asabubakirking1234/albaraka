  <text x="150" y="216" fill="#e7622a" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="5.4">QURILISH MOLLARI · TOSHKENT</text>
  <g transform="translate(686 158)">
