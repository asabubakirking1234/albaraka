    <path d="M90 624v136M230 624v136M370 624v136M510 624v136M650 624v136M790 624v136"/>
  </g>
  <ellipse cx="450" cy="650" rx="390" ry="36" fill="#8d7d64" opacity=".22" filter="url(#soft)"/>

