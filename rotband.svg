<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Rotband gips suvoq 30 kg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1ebe0"/>
      <stop offset="1" stop-color="#ddd3c1"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#1d2922" stroke-opacity=".05"/>
    </pattern>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset=".55" stop-color="#f0e8db"/>
      <stop offset="1" stop-color="#d8ccba"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c97575"/>
      <stop offset=".5" stop-color="#e39b98"/>
      <stop offset="1" stop-color="#b85f60"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef0ea"/>
      <stop offset=".4" stop-color="#b9c1b8"/>
      <stop offset=".7" stop-color="#f5f6f1"/>
      <stop offset="1" stop-color="#8f9a90"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="20" stdDeviation="15" flood-color="#2a2114" flood-opacity=".3"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="15"/></filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <circle cx="640" cy="142" r="166" fill="#e7622a" opacity=".08"/>
  <path d="M44 50h84M44 50v84M756 550h-84M756 550v-84" fill="none" stroke="#1d2922" stroke-opacity=".22"/>
  <text x="46" y="43" fill="#1d2922" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.8">AL BARAKA</text>
  <text x="754" y="43" fill="#6f776e" font-family="Arial,Helvetica,sans-serif" font-size="8" letter-spacing="2" text-anchor="end">GYPSUM / ROTBAND 30 KG</text>

  <ellipse cx="390" cy="500" rx="262" ry="32" fill="#7d6d54" opacity=".22" filter="url(#blur)"/>

  <g transform="translate(194 208) rotate(-3)" filter="url(#shadow)">
    <path d="M18 44 330 18l18 226q2 24-22 26L40 290q-24 2-26-24Z" fill="url(#bag)"/>
    <path d="m18 44 312-26 4 40L16 84Z" fill="#f8f3e8"/>
    <path d="M20 64 330 38" stroke="#b6a992" stroke-width="2" stroke-dasharray="7 7" opacity=".55"/>
    <path d="M16 84h318v52H14Z" fill="url(#pink)"/>
    <text x="42" y="106" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="8" font-weight="700" letter-spacing="2.4">GYPSUM PLASTER · MACHINE &amp; HAND</text>
    <text x="42" y="125" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="7" letter-spacing="1.6" opacity=".8">AL BARAKA SELECTED</text>
    <text x="40" y="180" fill="#1d2922" font-family="Arial,Helvetica,sans-serif" font-size="52" font-weight="800" letter-spacing="-1.6">ROT</text>
    <text x="40" y="228" fill="#1d2922" font-family="Arial,Helvetica,sans-serif" font-size="52" font-weight="800" letter-spacing="-1.6">BAND</text>
    <text x="40" y="252" fill="#b85f60" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="700" letter-spacing="2">30 KG · 10–40 MM</text>
    <path d="M40 266h264" stroke="#1d2922" stroke-opacity=".13"/>
    <text x="40" y="282" fill="#6f776e" font-family="Arial,Helvetica,sans-serif" font-size="7.5" letter-spacing="1.1">FOR WALLS &amp; CEILINGS · 25 KG/M²</text>
    <rect x="252" y="152" width="72" height="28" rx="2" fill="#fffdf8"/>
    <text x="262" y="171" fill="#1d2922" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" letter-spacing="1">30 KG</text>
  </g>

  <g transform="translate(548 402) rotate(20)" filter="url(#shadow)">
    <path d="M0 28 170 0l14 42L14 72Z" fill="url(#metal)"/>
    <path d="M14 72 184 40l6 12L20 84Z" fill="#7f8a80" opacity=".5"/>
    <rect x="166" y="10" width="74" height="18" rx="9" fill="#e7622a" transform="rotate(-10 166 10)"/>
    <rect x="224" y="0" width="86" height="15" rx="7.5" fill="#1d2922" transform="rotate(-10 224 0)"/>
  </g>

  <g fill="#c9bda9" opacity=".8">
    <circle cx="126" cy="514" r="2.6"/><circle cx="154" cy="526" r="1.8"/><circle cx="184" cy="510" r="2.2"/>
    <circle cx="632" cy="510" r="2.5"/><circle cx="660" cy="524" r="1.8"/>
  </g>

  <g transform="translate(74 96)">
    <rect x="0" y="0" width="150" height="86" rx="3" fill="#fffdf8" opacity=".9"/>
    <text x="13" y="20" fill="#6f776e" font-family="Arial,Helvetica,sans-serif" font-size="7" font-weight="700" letter-spacing="1.2">ONE BAG COVERS</text>
    <text x="13" y="48" fill="#1d2922" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800">≈ 2.5 m²</text>
    <path d="M13 58h122" stroke="#d9d1c2"/>
    <text x="13" y="73" fill="#4d584f" font-family="Arial,Helvetica,sans-serif" font-size="7" letter-spacing="1">10 MM LAYER</text>
  </g>

  <g transform="translate(46 540)">
