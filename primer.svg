  <g transform="translate(46 540)">
    <rect x="0" y="0" width="170" height="26" rx="2" fill="#fffdf8" opacity=".8"/>
    <text x="12" y="17" fill="#1d2922" font-family="Arial,Helvetica,sans-serif" font-size="8" font-weight="700" letter-spacing="1.5">5 L · BETON-KONTAKT</text>
