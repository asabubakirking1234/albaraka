      <stop offset="1" stop-color="#dbcebb"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6c7b1"/>
      <stop offset=".5" stop-color="#b9a68b"/>
      <stop offset="1" stop-color="#d9ccb7"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="190%">
